<svg xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13" viewBox="0 0 680 440"><style>text{fill:#1a1a2e}.label{font-weight:700;font-size:13px}.note,.step{font-size:11px;fill:#6b6b7b}.step{fill:#4a3a6b}line,rect.box{stroke:#1a1a2e;stroke-width:1.5}rect.box{fill:#f5f0ff;stroke:#7c5cbf;rx:4}line.lifeline{stroke:#b8b8c4}</style><rect width="680" height="440" x="0" y="0" fill="#fff" rx="8"/><text x="340" y="24" font-size="15" font-weight="bold" text-anchor="middle">ERC-7540 (asynchronous)</text><text x="90" y="58" class="label" text-anchor="middle">Investor</text><text x="320" y="58" class="label" text-anchor="middle">Vault</text><text x="560" y="58" class="label" text-anchor="middle">Manager</text><line x1="90" x2="90" y1="68" y2="420" stroke-dasharray="4 4" class="lifeline"/><line x1="320" x2="320" y1="68" y2="420" stroke-dasharray="4 4" class="lifeline"/><line x1="560" x2="560" y1="68" y2="420" stroke-dasharray="4 4" class="lifeline"/><line x1="90" x2="310" y1="95" y2="95" marker-end="url(#arr)"/><text x="200" y="88" font-size="12" text-anchor="middle">requestDeposit()</text><text x="200" y="115" class="note" text-anchor="middle">assets locked</text><line x1="320" x2="550" y1="130" y2="130" marker-end="url(#arr)"/><text x="435" y="123" font-size="12" text-anchor="middle">batch to manager</text><rect width="200" height="150" x="460" y="150" class="box"/><text x="560" y="172" class="step" font-weight="bold" text-anchor="middle">Step 1: Approve</text><text x="560" y="188" class="step" text-anchor="middle">set asset price,</text><text x="560" y="204" class="step" text-anchor="middle">release assets for investment</text><text x="560" y="230" class="step" text-anchor="middle">... manager invests ...</text><text x="560" y="258" class="step" font-weight="bold" text-anchor="middle">Step 2: Issue</text><text x="560" y="274" class="step" text-anchor="middle">set share price,</text><text x="560" y="290" class="step" text-anchor="middle">mint shares</text><line x1="560" x2="330" y1="320" y2="320" stroke-dasharray="6 3" marker-end="url(#arr)"/><text x="445" y="340" font-size="12" text-anchor="middle">fulfillment</text><line x1="90" x2="310" y1="370" y2="370" marker-end="url(#arr)"/><text x="200" y="363" font-size="12" text-anchor="middle">deposit()</text><line x1="320" x2="100" y1="395" y2="395" stroke-dasharray="6 3" marker-end="url(#arr)"/><text x="200" y="388" font-size="12" text-anchor="middle">shares</text><text x="200" y="415" class="note" text-anchor="middle">(claim)</text><defs><marker id="arr" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><path fill="#1a1a2e" d="M0,0 L8,3 L0,6"/></marker></defs></svg>